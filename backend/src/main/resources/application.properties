spring.application.name=backend
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA (shared by both profiles)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (loaded from env var; no default in shared config)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-seconds=604800

# Cookie
app.cookie.name=token
app.cookie.same-site=Lax

# Frontend origin (CORS)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Email base URL (for reset link)
app.email.base-url=${APP_BASE_URL:http://localhost:5173}
